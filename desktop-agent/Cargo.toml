[package]
name = "aetherdesk-agent"
version = "1.0.0"
edition = "2021"
authors = ["AetherDesk Engineering Team"]
description = "High-performance low-latency Remote Desktop Host Agent"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Windows DXGI Screen Capture & Input Injection APIs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance"
] }

# Scrap crate for cross-platform fallback capture
scrap = "0.5"

[build-dependencies]
